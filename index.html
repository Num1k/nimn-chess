<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nimn Chess</title><style>body{font:17px system-ui;background:#202322;color:#eee;margin:16px auto;max-width:620px;padding:0 12px}h2{margin:8px 0}#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;touch-action:manipulation} .sq{position:relative;display:grid;place-items:center;border:0;padding:0;border-radius:0;aspect-ratio:1;font-family:'Apple Symbols','Segoe UI Symbol',serif;font-size:clamp(24px,9vw,65px);line-height:1;color:#171717}.white{color:#fffdf4;text-shadow:0 0 1px #111,1px 1px #333,-1px -1px #333}.sel{box-shadow:inset 0 0 0 5px #e9bc36}.target:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#176b4599}.target.capture:after{width:85%;height:85%;background:none;border:4px solid #176b4599}small{position:absolute;left:3px;top:2px;font:11px system-ui;color:#333}small.file{left:auto;top:auto;right:3px;bottom:2px}button,input{font:inherit}button{cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button{padding:10px;border:0;border-radius:8px;background:#444;color:white}input{box-sizing:border-box;width:100%;padding:10px;border-radius:6px}#msg{font-size:13px;color:#bfcac2;min-height:20px}</style><h2>Nimn Chess</h2><div id="status"></div><div id="board"></div><nav><button onclick="copyFen()">Copy FEN</button><button onclick="loadFen()">Load FEN</button><button onclick="undo()">Undo</button><button onclick="reset()">Reset</button></nav><input id="fen" placeholder="Klistra in FEN här" autocapitalize="off" spellcheck="false"><div id="msg"></div><script>
const initial='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', glyph={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟︎','.':''}, dirs={n:[-33,-31,-18,-14,14,18,31,33],b:[-17,-15,15,17],r:[-16,-1,1,16],k:[-17,-16,-15,-1,1,15,16,17]};const on=i=>i>=0&&i<128&&!(i&136),side=p=>p==='.'?0:p===p.toUpperCase()?1:-1,sq=i=>'abcdefgh'[i&7]+(8-(i>>4)),idx=s=>(8-Number(s[1]))*16+'abcdefgh'.indexOf(s[0]);
function parse(f){let a=f.trim().split(/\s+/),b=Array(128).fill('.'),rows=a[0].split('/');if(rows.length!==8||!['w','b'].includes(a[1])||!/^(?:-|K?Q?k?q?)$/.test(a[2])||!/^(?:-|[a-h][36])$/.test(a[3]))throw Error('Ogiltig FEN');rows.forEach((r,i)=>{let j=0;for(let p of r){if(/[1-8]/.test(p))j+=+p;else if(/[prnbqk]/i.test(p)&&j<8)b[i*16+j++]=p;else throw Error('Ogiltig FEN')}if(j!==8)throw Error('Ogiltig rad')});if(b.filter(p=>p==='K').length!==1||b.filter(p=>p==='k').length!==1)throw Error('Två kungar krävs');return {b,t:a[1]==='w'?1:-1,c:a[2],ep:a[3]==='-'?-1:idx(a[3]),half:+(a[4]||0),full:+(a[5]||1)}}
function fen(s){let rows=[];for(let r=0;r<8;r++){let str='',n=0;for(let c=0;c<8;c++){let p=s.b[r*16+c];if(p==='.')n++;else{if(n)str+=n;n=0;str+=p}}if(n)str+=n;rows.push(str)}return [rows.join('/'),s.t===1?'w':'b',s.c||'-',s.ep<0?'-':sq(s.ep),s.half,s.full].join(' ')}
function attacked(s,target,by){for(let f=0;f<128;f++){if(!on(f)||side(s.b[f])!==by)continue;let p=s.b[f].toLowerCase();if(p==='p'){if([f-16*by-1,f-16*by+1].includes(target))return true;continue}for(let d of dirs[p]||dirs.k)for(let t=f+d;on(t);t+=d){if(t===target)return true;if(s.b[t]!=='.'||p==='n'||p==='k')break}}return false}const check=(s,t=s.t)=>attacked(s,s.b.indexOf(t===1?'K':'k'),-t);
function apply(s,m){let [f,t,promo,flag]=m,b=s.b.slice(),p=b[f],cap=b[t],c=s.c;b[f]='.';b[t]=promo?(s.t===1?promo.toUpperCase():promo):p;if(flag==='ep')b[t+16*s.t]='.';if(flag==='castle'){let rf=t>f?f+3:f-4,rt=t>f?f+1:f-1;b[rt]=b[rf];b[rf]='.'}if(p==='K')c=c.replace(/[KQ]/g,'');if(p==='k')c=c.replace(/[kq]/g,'');let rights={119:'K',112:'Q',7:'k',0:'q'};if(p.toLowerCase()==='r'&&rights[f])c=c.replace(rights[f],'');if(cap.toLowerCase()==='r'&&rights[t])c=c.replace(rights[t],'');return {b,t:-s.t,c,ep:p.toLowerCase()==='p'&&Math.abs(t-f)===32?(t+f)/2:-1,half:p.toLowerCase()==='p'||cap!=='.'?0:s.half+1,full:s.full+(s.t===-1?1:0)}}
function legal(s){let out=[];for(let f=0;f<128;f++){if(!on(f)||side(s.b[f])!==s.t)continue;let p=s.b[f].toLowerCase();function add(t,flag=''){if(s.b[t].toLowerCase()==='k')return;if(p==='p'&&[0,7].includes(t>>4))for(let q of 'qrbn')out.push([f,t,q,flag]);else out.push([f,t,'',flag])}if(p==='p'){let t=f-16*s.t;if(on(t)&&s.b[t]==='.'){add(t);let u=t-16*s.t;if(f>>4===(s.t===1?6:1)&&s.b[u]==='.')add(u)}for(let d of [-1,1]){let u=t+d;if(!on(u))continue;if(side(s.b[u])===-s.t)add(u);else if(u===s.ep&&s.b[u]==='.'&&s.b[u+16*s.t]===(s.t===1?'p':'P'))add(u,'ep')}}else{for(let d of dirs[p]||dirs.k)for(let t=f+d;on(t);t+=d){if(side(s.b[t])===s.t)break;add(t);if(s.b[t]!=='.'||p==='n'||p==='k')break}if(p==='k'&&f===(s.t===1?116:4)&&!check(s)){let rook=s.t===1?'R':'r';if(s.c.includes(s.t===1?'K':'k')&&s.b[f+3]===rook&&s.b[f+1]==='.'&&s.b[f+2]==='.'&&!attacked(s,f+1,-s.t)&&!attacked(s,f+2,-s.t))add(f+2,'castle');if(s.c.includes(s.t===1?'Q':'q')&&s.b[f-4]===rook&&[1,2,3].every(d=>s.b[f-d]==='.')&&!attacked(s,f-1,-s.t)&&!attacked(s,f-2,-s.t))add(f-2,'castle')}}}return out.filter(m=>!check(apply(s,m),s.t))}
let hist=[parse(initial)],selected=-1;const $=id=>document.getElementById(id);try{let saved=JSON.parse(localStorage.getItem('nimn-chess-v1'));if(saved?.length)hist=saved.map(parse)}catch(e){}function save(){try{localStorage.setItem('nimn-chess-v1',JSON.stringify(hist.map(fen)));$('msg').textContent='Ställningen sparad lokalt.'}catch(e){$('msg').textContent='Lokal lagring är inte tillgänglig. Kopiera FEN.'}}
function render(){let s=hist.at(-1),moves=legal(s),targets=moves.filter(m=>m[0]===selected).map(m=>m[1]);$('status').textContent=moves.length?(s.t===1?'Vit':'Svart')+' vid draget · '+s.full+(check(s)?' · Schack':''):check(s)?'Schackmatt':'Patt';$('board').replaceChildren();for(let j=0;j<64;j++){let i=(j>>3)*16+(j&7),p=s.b[i],el=document.createElement('button');el.className='sq '+(side(p)===1?'white ':'')+(selected===i?'sel ':'')+(targets.includes(i)?'target ':'')+(p!=='.'?'capture':'');el.style.background=((i>>4)+(i&7))%2?'#b58863':'#f0d9b5';el.textContent=glyph[p];el.setAttribute('aria-label',sq(i)+' '+p);if((i&7)===0)el.innerHTML+='<small>'+ (8-(i>>4))+'</small>';if(i>>4===7)el.innerHTML+='<small class="file">'+sq(i)[0]+'</small>';el.onclick=()=>{if(side(p)===s.t){selected=selected===i?-1:i;render();return}let choices=moves.filter(m=>m[0]===selected&&m[1]===i);if(!choices.length)return;let m=choices[0];if(choices.length>1){let q=prompt('Promotion: q, r, b, n','q');m=choices.find(x=>x[2]===q?.toLowerCase());if(!m)return}hist.push(apply(s,m));selected=-1;save();render()};$('board').append(el)}$('fen').value=fen(s)}
async function copyFen(){let f=fen(hist.at(-1));try{await navigator.clipboard.writeText(f);$('msg').textContent='FEN kopierad.'}catch(e){$('fen').value=f;$('fen').focus();$('fen').select();try{if(document.execCommand('copy')){$('msg').textContent='FEN kopierad.';return}}catch(e){}$('msg').textContent='Markera och kopiera FEN manuellt.'}}function loadFen(){try{hist.push(parse($('fen').value));selected=-1;save();render()}catch(e){$('msg').textContent=e.message}}function undo(){if(hist.length>1)hist.pop();selected=-1;save();render()}function reset(){if(confirm('Återställ till startpositionen?')){hist=[parse(initial)];selected=-1;save();render()}}render();save();
</script></html>
